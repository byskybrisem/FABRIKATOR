name: FABRIKATOR Web
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build:web
      - run: npx expo install --check
      - run: npx expo export --platform all --output-dir dist/native --max-workers 2
        env:
          EXPO_NO_TELEMETRY: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.62.0 && python -m playwright install --with-deps webkit chromium
      - run: python tests/web_browser.py
      - run: BROWSER=chromium python tests/web_browser.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live game
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "$SITE" | grep -q 'web/game.js' \
              && curl -fsS -o /dev/null "${SITE}web/game.js" \
              && curl -fsS -o /dev/null "${SITE}sw.js"; then
              echo "Live: $SITE"; exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE did not serve the game"; exit 1
